name: Deploy React Website to GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'react-website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-website/package-lock.json
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        continue-on-error: true
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./react-website
      
      - name: Build
        run: npm run build
        working-directory: ./react-website
      
      - name: Upload artifact for GitHub Actions Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./react-website/dist
        continue-on-error: true

      - name: Deploy to GitHub Pages (Actions Mode)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to gh-pages branch (Branch Mode Fallback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./react-website/dist
