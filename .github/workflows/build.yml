name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.8)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Validate secrets exist
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.COUNTLY_SERVER_URL }}" ]; then
            echo "⚠️ Warning: COUNTLY_SERVER_URL secret not set. Analytics will be disabled."
          else
            echo "✅ COUNTLY_SERVER_URL secret is configured"
          fi
          
          if [ -z "${{ secrets.COUNTLY_APP_KEY }}" ]; then
            echo "⚠️ Warning: COUNTLY_APP_KEY secret not set. Analytics will be disabled."
          else
            echo "✅ COUNTLY_APP_KEY secret is configured (masked)"
          fi

          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "⚠️ Warning: ANDROID_KEYSTORE_BASE64 secret not set. Will use debug keystore (builds may fail signature checks)."
          else
            echo "✅ ANDROID_KEYSTORE_BASE64 secret is configured"
          fi
        continue-on-error: true

  # Android Build
  build-android:
    runs-on: ubuntu-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "Decoding keystore from base64..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/groovy-release.keystore
          
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=groovy-release.keystore
          EOF
          
          echo "✅ Keystore configured for signing"
      
      - name: Build APKs
        env:
          COUNTLY_SERVER_URL: ${{ secrets.COUNTLY_SERVER_URL }}
          COUNTLY_APP_KEY: ${{ secrets.COUNTLY_APP_KEY }}
        run: |
          if [ -n "$COUNTLY_APP_KEY" ]; then
            echo "::add-mask::$COUNTLY_APP_KEY"
            flutter build apk --release \
              --dart-define=COUNTLY_SERVER_URL="$COUNTLY_SERVER_URL" \
              --dart-define=COUNTLY_APP_KEY="$COUNTLY_APP_KEY"
          else
            flutter build apk --release
          fi
      
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

  # Windows Build
  build-windows:
    runs-on: windows-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Windows
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /D_SILENCE_ALL_MS_EXT_DEPRECATION_WARNINGS"
          _CL_: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /D_SILENCE_ALL_MS_EXT_DEPRECATION_WARNINGS"
          COUNTLY_SERVER_URL: ${{ secrets.COUNTLY_SERVER_URL }}
          COUNTLY_APP_KEY: ${{ secrets.COUNTLY_APP_KEY }}
        run: |
          if ($env:COUNTLY_APP_KEY) {
            $key = $env:COUNTLY_APP_KEY
            Write-Host "::add-mask::$key"
            flutter build windows --release `
              --dart-define=COUNTLY_SERVER_URL="$env:COUNTLY_SERVER_URL" `
              --dart-define=COUNTLY_APP_KEY="$key"
          } else {
            flutter build windows --release
          }
      
      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Download bundled yt-dlp binary
        run: |
          curl.exe -L -o build\windows\x64\runner\Release\yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe

      - name: Build Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create Portable Zip
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Groovy-Windows-Portable.zip" -Force

      - name: Prepare Windows Package
        run: |
          New-Item -ItemType Directory -Force -Path windows_package
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination "windows_package\" -Recurse -Force
          Copy-Item -Path "Groovy-Setup.exe" -Destination "windows_package\" -Force
          Copy-Item -Path "Groovy-Windows-Portable.zip" -Destination "windows_package\" -Force

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: windows_package/

  # Linux Build
  build-linux:
    runs-on: ubuntu-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev libnotify-dev libsecret-1-dev libjsoncpp-dev libmpv-dev mpv
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Linux
        env:
          COUNTLY_SERVER_URL: ${{ secrets.COUNTLY_SERVER_URL }}
          COUNTLY_APP_KEY: ${{ secrets.COUNTLY_APP_KEY }}
        run: |
          if [ -n "$COUNTLY_APP_KEY" ]; then
            echo "::add-mask::$COUNTLY_APP_KEY"
            flutter build linux --release \
              --dart-define=COUNTLY_SERVER_URL="$COUNTLY_SERVER_URL" \
              --dart-define=COUNTLY_APP_KEY="$COUNTLY_APP_KEY"
          else
            flutter build linux --release
          fi
      
      - name: Download bundled yt-dlp for Linux
        run: |
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o build/linux/x64/release/bundle/yt-dlp
          chmod a+rx build/linux/x64/release/bundle/yt-dlp

      - name: Create AppImage
        run: |
          BUNDLE=build/linux/x64/release/bundle
          APPDIR=build/linux/AppDir
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)

          # Build AppDir structure
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/lib/groovy"
          mkdir -p "${APPDIR}/usr/share/applications"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/512x512/apps"

          cp -r "${BUNDLE}/." "${APPDIR}/usr/lib/groovy/"

          cat > "${APPDIR}/usr/bin/groovy" << 'WRAP'
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "$0")")"
          APPLIB="${HERE}/../lib/groovy"
          export LD_LIBRARY_PATH="${APPLIB}/lib:${LD_LIBRARY_PATH:-}"
          exec "${APPLIB}/groovy" "$@"
          WRAP
          chmod +x "${APPDIR}/usr/bin/groovy"

          cat > "${APPDIR}/usr/share/applications/groovy.desktop" << 'DESK'
          [Desktop Entry]
          Name=Groovy
          Comment=Stream music from YouTube Music
          Exec=groovy
          Icon=groovy
          Terminal=false
          Type=Application
          Categories=Audio;Music;Player;AudioVideo;
          Keywords=music;streaming;youtube;
          StartupWMClass=groovy
          DESK

          cp assets/app_icon.png "${APPDIR}/usr/share/icons/hicolor/256x256/apps/groovy.png"
          cp assets/app_icon_1024.png "${APPDIR}/usr/share/icons/hicolor/512x512/apps/groovy.png"

          cp "${APPDIR}/usr/share/applications/groovy.desktop" "${APPDIR}/groovy.desktop"
          cp "${APPDIR}/usr/share/icons/hicolor/256x256/apps/groovy.png" "${APPDIR}/groovy.png"
          ln -sf groovy.png "${APPDIR}/.DirIcon"

          cat > "${APPDIR}/AppRun" << 'APPRUN'
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "$0")")"
          APPLIB="${HERE}/usr/lib/groovy"
          export LD_LIBRARY_PATH="${APPLIB}/lib:${LD_LIBRARY_PATH:-}"
          export XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          exec "${APPLIB}/groovy" "$@"
          APPRUN
          chmod +x "${APPDIR}/AppRun"

          # Download appimagetool
          curl -L \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o appimagetool.AppImage
          chmod +x appimagetool.AppImage

          ARCH=x86_64 ./appimagetool.AppImage --no-appstream "${APPDIR}" "Groovy-${VERSION}-linux-x86_64.AppImage"
          echo "✅ AppImage created: Groovy-${VERSION}-linux-x86_64.AppImage"

          # Bundle the easy-install script alongside the AppImage
          cp install-linux.sh "Groovy-linux-install.sh"
          chmod +x "Groovy-linux-install.sh"

      - name: Build Debian Package (.deb)
        run: |
          BUNDLE=build/linux/x64/release/bundle
          DEBDIR=build/linux/deb_package
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)

          mkdir -p "${DEBDIR}/opt/groovy"
          mkdir -p "${DEBDIR}/usr/bin"
          mkdir -p "${DEBDIR}/usr/share/applications"
          mkdir -p "${DEBDIR}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${DEBDIR}/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "${DEBDIR}/DEBIAN"

          cp -r "${BUNDLE}/." "${DEBDIR}/opt/groovy/"
          chmod +x "${DEBDIR}/opt/groovy/groovy"
          [ -f "${DEBDIR}/opt/groovy/yt-dlp" ] && chmod +x "${DEBDIR}/opt/groovy/yt-dlp"

          cat > "${DEBDIR}/usr/bin/groovy" << 'LAUNCHER'
          #!/usr/bin/env bash
          exec /opt/groovy/groovy "$@"
          LAUNCHER
          chmod +x "${DEBDIR}/usr/bin/groovy"

          cat > "${DEBDIR}/usr/share/applications/groovy.desktop" << 'DESK'
          [Desktop Entry]
          Name=Groovy
          Comment=Stream music from YouTube Music
          Exec=/usr/bin/groovy %U
          Icon=groovy
          Terminal=false
          Type=Application
          Categories=Audio;Music;Player;AudioVideo;
          Keywords=music;streaming;youtube;
          StartupWMClass=groovy
          MimeType=x-scheme-handler/groovy;
          DESK
          chmod 644 "${DEBDIR}/usr/share/applications/groovy.desktop"

          cp assets/app_icon.png "${DEBDIR}/usr/share/icons/hicolor/256x256/apps/groovy.png"
          cp assets/app_icon_1024.png "${DEBDIR}/usr/share/icons/hicolor/512x512/apps/groovy.png"

          cat > "${DEBDIR}/DEBIAN/control" << CONTROL
          Package: groovy
          Version: ${VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Danx016 <danx016@github.com>
          Depends: libgtk-3-0, libglib2.0-0, libmpv2 | libmpv1, libpulse0, libsecret-1-0
          Description: Groovy Music Player
           Stream music from YouTube Music with high quality audio, synced lyrics, and modern UI.
          CONTROL
          chmod 644 "${DEBDIR}/DEBIAN/control"

          cat > "${DEBDIR}/DEBIAN/postinst" << 'POSTINST'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -q -f -t /usr/share/icons/hicolor || true
          fi
          exit 0
          POSTINST
          chmod 755 "${DEBDIR}/DEBIAN/postinst"

          cat > "${DEBDIR}/DEBIAN/postrm" << 'POSTRM'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -q -f -t /usr/share/icons/hicolor || true
          fi
          exit 0
          POSTRM
          chmod 755 "${DEBDIR}/DEBIAN/postrm"

          dpkg-deb --build --root-owner-group "${DEBDIR}" "Groovy-${VERSION}-linux-amd64.deb"
          cp "Groovy-${VERSION}-linux-amd64.deb" "Groovy-Linux.deb"
          echo "✅ DEB package created: Groovy-Linux.deb"

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            build/linux/x64/release/bundle/
            Groovy-*-linux-x86_64.AppImage
            Groovy-linux-install.sh
            *.deb


  # Create Release with Android, Windows, and Linux artifacts
  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="1.0.59"
          fi
          echo "VERSION=$VER" >> $GITHUB_OUTPUT
          echo "TAG=v$VER" >> $GITHUB_OUTPUT

      - name: Create Tag (if workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.get_version.outputs.TAG }}" -m "Release ${{ steps.get_version.outputs.TAG }}" || true
          git push origin "${{ steps.get_version.outputs.TAG }}" || true

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts/linux/

      - name: Package Windows
        run: |
          if [ ! -f artifacts/windows/Groovy-Windows-Portable.zip ]; then
            cd artifacts/windows && zip -r ../../Groovy-Windows-Portable.zip . && cd ../..
          else
            cp artifacts/windows/Groovy-Windows-Portable.zip ./Groovy-Windows-Portable.zip
          fi

      - name: Package Linux
        run: |
          # Copy DEB packages
          find artifacts/linux -name '*.deb' -exec cp {} ./ \;
          # Find the AppImage
          APPIMAGE=$(find artifacts/linux -name '*.AppImage' 2>/dev/null | head -1)
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" ./Groovy-linux-x86_64.AppImage
            echo "✅ AppImage packaged: Groovy-linux-x86_64.AppImage"
          fi
          # Bundle easy-install script
          if [ -f artifacts/linux/Groovy-linux-install.sh ]; then
            cp artifacts/linux/Groovy-linux-install.sh ./Groovy-linux-install.sh
            chmod +x ./Groovy-linux-install.sh
          fi
          # Also create tar.gz from bundle
          mkdir -p linux_bundle
          find artifacts/linux -not -name '*.AppImage' -not -name '*.deb' -exec cp -r {} linux_bundle/ \; 2>/dev/null || true
          cd artifacts/linux && tar -czf ../../groovy-linux-x64.tar.gz . && cd ../..  

      - name: Generate Dynamic Release Notes from CHANGELOG
        run: |
          python3 -c "
          import sys, re

          ver = '${{ steps.get_version.outputs.VERSION }}'
          tag = '${{ steps.get_version.outputs.TAG }}'
          notes = ''
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              # Match ## [VERSION] or ## [vVERSION] up to next ## [
              pattern = rf'##\s*\[v?{re.escape(ver)}\][^\n]*\n(.*?)(?=\n##\s*\[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match and match.group(1).strip():
                  notes = match.group(1).strip()
                  print(f'✅ Extracted release notes for version {ver} from CHANGELOG.md')
          except Exception as e:
              print(f'⚠️ Error reading CHANGELOG.md: {e}')

          if not notes:
              print('ℹ️ No specific section in CHANGELOG.md; generating from git commit log')
              import subprocess
              try:
                  cmd = ['git', 'log', '-n', '10', '--pretty=format:- %s']
                  notes = subprocess.check_output(cmd, text=True)
              except Exception:
                  notes = '- Mejoras de estabilidad, rendimiento y correcciones generales.'

          body = f'''## 🎵 Groovy {tag}

          ### ✨ Novedades y Mejoras:
          {notes}

          ### 📦 Descargas Disponibles:

          **📱 Android:**
          - \`app-release.apk\` — APK universal para cualquier dispositivo Android

          **🪟 Windows:**
          - \`Groovy-Setup.exe\` — Instalador con asistente para Windows
          - \`Groovy-Windows-Portable.zip\` — Versión portable, descomprimir y usar

          **🐧 Linux:**
          - \`Groovy-Linux.deb\` — ⭐ **Instalador Recomendado (Ubuntu, Debian, Linux Mint, Pop!_OS, Zorin).** Doble clic y presiona \"Instalar\" (2 toques).
          - \`Groovy-linux-x86_64.AppImage\` — Binario portable ejecutable sin instalar (para Fedora, Arch, etc.).
          - \`Groovy-linux-install.sh\` — Asistente de instalación automática para AppImage.
          - \`groovy-linux-x64.tar.gz\` — Paquete comprimido para instalación manual

          ### 📝 Registro Completo de Cambios
          Consulta [CHANGELOG.md](https://github.com/Danx016/Groovy/blob/master/CHANGELOG.md) para el historial completo.
          '''

          with open('RELEASE_BODY.md', 'w', encoding='utf-8') as out:
              out.write(body)
          "

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: Groovy ${{ steps.get_version.outputs.TAG }}
          body_path: RELEASE_BODY.md
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            artifacts/android/*.apk
            artifacts/windows/Groovy-Setup.exe
            artifacts/windows/Groovy-Windows-Portable.zip
            Groovy-Windows-Portable.zip
            Groovy-Linux.deb
            Groovy-*-linux-amd64.deb
            Groovy-linux-x86_64.AppImage
            Groovy-linux-install.sh
            groovy-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
