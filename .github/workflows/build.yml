name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.8)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Validate secrets exist
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.COUNTLY_SERVER_URL }}" ]; then
            echo "⚠️ Warning: COUNTLY_SERVER_URL secret not set. Analytics will be disabled."
          else
            echo "✅ COUNTLY_SERVER_URL secret is configured"
          fi
          
          if [ -z "${{ secrets.COUNTLY_APP_KEY }}" ]; then
            echo "⚠️ Warning: COUNTLY_APP_KEY secret not set. Analytics will be disabled."
          else
            echo "✅ COUNTLY_APP_KEY secret is configured (masked)"
          fi

          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "⚠️ Warning: ANDROID_KEYSTORE_BASE64 secret not set. Will use debug keystore (builds may fail signature checks)."
          else
            echo "✅ ANDROID_KEYSTORE_BASE64 secret is configured"
          fi
        continue-on-error: true

  # Android Build
  build-android:
    runs-on: ubuntu-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "Decoding keystore from base64..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/musly-release.keystore
          
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=musly-release.keystore
          EOF
          
          echo "✅ Keystore configured for signing"
      
      - name: Build APKs
        env:
          COUNTLY_SERVER_URL: ${{ secrets.COUNTLY_SERVER_URL }}
          COUNTLY_APP_KEY: ${{ secrets.COUNTLY_APP_KEY }}
        run: |
          if [ -n "$COUNTLY_APP_KEY" ]; then
            echo "::add-mask::$COUNTLY_APP_KEY"
            flutter build apk --release \
              --dart-define=COUNTLY_SERVER_URL="$COUNTLY_SERVER_URL" \
              --dart-define=COUNTLY_APP_KEY="$COUNTLY_APP_KEY"
          else
            flutter build apk --release
          fi
      
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

  # Windows Build
  build-windows:
    runs-on: windows-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Windows
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /D_SILENCE_ALL_MS_EXT_DEPRECATION_WARNINGS"
          _CL_: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /D_SILENCE_ALL_MS_EXT_DEPRECATION_WARNINGS"
          COUNTLY_SERVER_URL: ${{ secrets.COUNTLY_SERVER_URL }}
          COUNTLY_APP_KEY: ${{ secrets.COUNTLY_APP_KEY }}
        run: |
          if ($env:COUNTLY_APP_KEY) {
            $key = $env:COUNTLY_APP_KEY
            Write-Host "::add-mask::$key"
            flutter build windows --release `
              --dart-define=COUNTLY_SERVER_URL="$env:COUNTLY_SERVER_URL" `
              --dart-define=COUNTLY_APP_KEY="$key"
          } else {
            flutter build windows --release
          }
      
      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Download bundled yt-dlp binary
        run: |
          curl.exe -L -o build\windows\x64\runner\Release\yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe

      - name: Build Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create Portable Zip
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Groovy-Windows-Portable.zip" -Force

      - name: Prepare Windows Package
        run: |
          New-Item -ItemType Directory -Force -Path windows_package
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination "windows_package\" -Recurse -Force
          Copy-Item -Path "Groovy-Setup.exe" -Destination "windows_package\" -Force
          Copy-Item -Path "Groovy-Windows-Portable.zip" -Destination "windows_package\" -Force

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: windows_package/

  # Linux Build
  build-linux:
    runs-on: ubuntu-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev libnotify-dev libsecret-1-dev libjsoncpp-dev libmpv-dev mpv
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Linux
        env:
          COUNTLY_SERVER_URL: ${{ secrets.COUNTLY_SERVER_URL }}
          COUNTLY_APP_KEY: ${{ secrets.COUNTLY_APP_KEY }}
        run: |
          if [ -n "$COUNTLY_APP_KEY" ]; then
            echo "::add-mask::$COUNTLY_APP_KEY"
            flutter build linux --release \
              --dart-define=COUNTLY_SERVER_URL="$COUNTLY_SERVER_URL" \
              --dart-define=COUNTLY_APP_KEY="$COUNTLY_APP_KEY"
          else
            flutter build linux --release
          fi
      
      - name: Download bundled yt-dlp for Linux
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o build/linux/x64/release/bundle/yt-dlp
          sudo chmod a+rx build/linux/x64/release/bundle/yt-dlp

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/

  # Create Release with Android, Windows, and Linux artifacts
  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="1.0.59"
          fi
          echo "VERSION=$VER" >> $GITHUB_OUTPUT
          echo "TAG=v$VER" >> $GITHUB_OUTPUT

      - name: Create Tag (if workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.get_version.outputs.TAG }}" -m "Release ${{ steps.get_version.outputs.TAG }}" || true
          git push origin "${{ steps.get_version.outputs.TAG }}" || true

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts/linux/

      - name: Package Windows
        run: |
          if [ ! -f artifacts/windows/Groovy-Windows-Portable.zip ]; then
            cd artifacts/windows && zip -r ../../Groovy-Windows-Portable.zip . && cd ../..
          else
            cp artifacts/windows/Groovy-Windows-Portable.zip ./Groovy-Windows-Portable.zip
          fi

      - name: Package Linux
        run: |
          cd artifacts/linux
          tar -czf ../../groovy-linux-x64.tar.gz .
          cd ../..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: Groovy ${{ steps.get_version.outputs.TAG }}
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            ## 🎵 Groovy ${{ steps.get_version.outputs.TAG }}

            ### ✨ Novedades y Mejoras:
            - 🖥️ **Soporte Oficial para Windows y Linux**: Nuevo instalador ejecutable (`Groovy-Setup.exe`), versión portable (`.zip`) y paquete Linux (`.tar.gz`) con optimizaciones completas de escritorio.
            - ⚡ **Motor de Streaming yt-dlp & YouTube**: Reproducción ultrarrápida, streaming de audio directo y caché inteligente.
            - 🎨 **Interfaz Renovada Estilo Apple Music**: Barra lateral, nuevo reproductor de escritorio, panel de letras sincronizadas y navegación fluida a 120 Hz.
            - 📱 **Sincronización Multiplataforma**: Experiencia unificada entre móvil (Android) y escritorio (Windows / Linux).
            - 🛡️ **Correcciones y Rendimiento**: Mejoras de estabilidad, gestión de colas y consumo de memoria.

            ### 📦 Descargas Disponibles:

            **📱 Android:**
            - `app-release.apk` (APK universal para cualquier dispositivo Android)

            **🪟 Windows:**
            - `Groovy-Setup.exe` (Instalador con asistente para Windows)
            - `Groovy-Windows-Portable.zip` (Versión portable, descomprimir y usar)

            **🐧 Linux:**
            - `groovy-linux-x64.tar.gz` (Binario empaquetado para Linux x64)

            ### 📝 Registro de Cambios
            Consulta [CHANGELOG.md](https://github.com/Danx016/Groovy/blob/master/CHANGELOG.md) para más detalles.
          files: |
            artifacts/android/*.apk
            artifacts/windows/Groovy-Setup.exe
            artifacts/windows/Groovy-Windows-Portable.zip
            Groovy-Windows-Portable.zip
            groovy-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
