name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.8)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.41.7'

jobs:
  # Validate secrets exist
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.COUNTLY_SERVER_URL }}" ]; then
            echo "⚠️ Warning: COUNTLY_SERVER_URL secret not set. Analytics will be disabled."
          else
            echo "✅ COUNTLY_SERVER_URL secret is configured"
          fi
          
          if [ -z "${{ secrets.COUNTLY_APP_KEY }}" ]; then
            echo "⚠️ Warning: COUNTLY_APP_KEY secret not set. Analytics will be disabled."
          else
            echo "✅ COUNTLY_APP_KEY secret is configured (masked)"
          fi

          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "⚠️ Warning: ANDROID_KEYSTORE_BASE64 secret not set. Will use debug keystore (builds may fail signature checks)."
          else
            echo "✅ ANDROID_KEYSTORE_BASE64 secret is configured"
          fi
        continue-on-error: true

  # Android Build
  build-android:
    runs-on: ubuntu-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'
      
      - name: Verify Dart SDK Version
        run: |
          DART_VERSION=$(dart --version | grep -oP 'Dart SDK version: \K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "✅ Dart SDK version: $DART_VERSION"
      
      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "Decoding keystore from base64..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/musly-release.keystore
          
          # Create key.properties
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=musly-release.keystore
          EOF
          
          echo "✅ Keystore configured for signing"
      
      - name: Build APKs
        env:
          COUNTLY_SERVER_URL: ${{ secrets.COUNTLY_SERVER_URL }}
          COUNTLY_APP_KEY: ${{ secrets.COUNTLY_APP_KEY }}
        run: |
          if [ -n "$COUNTLY_APP_KEY" ]; then
            echo "::add-mask::$COUNTLY_APP_KEY"
            flutter build apk --release \
              --dart-define=COUNTLY_SERVER_URL="$COUNTLY_SERVER_URL" \
              --dart-define=COUNTLY_APP_KEY="$COUNTLY_APP_KEY"
          else
            flutter build apk --release
          fi
      
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

  # iOS Build (macOS required)
  build-ios:
    runs-on: macos-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
  # Windows Build
  build-windows:
    runs-on: windows-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'
      
      - name: Verify Dart SDK Version
        shell: pwsh
        run: |
          $DART_VERSION = (dart --version 2>&1 | Select-String -Pattern 'Dart SDK version: ([0-9]+\.[0-9]+\.[0-9]+)').Matches.Groups[1].Value
          Write-Host "✅ Dart SDK version: $DART_VERSION"
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Windows
        env:
          COUNTLY_SERVER_URL: ${{ secrets.COUNTLY_SERVER_URL }}
          COUNTLY_APP_KEY: ${{ secrets.COUNTLY_APP_KEY }}
        run: |
          if ($env:COUNTLY_APP_KEY) {
            $key = $env:COUNTLY_APP_KEY
            Write-Host "::add-mask::$key"
            flutter build windows --release `
              --dart-define=COUNTLY_SERVER_URL="$env:COUNTLY_SERVER_URL" `
              --dart-define=COUNTLY_APP_KEY="$key"
          } else {
            flutter build windows --release
          }
      
      - name: Install NSIS
        run: choco install nsis -y

      - name: Build NSIS Installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Prepare Windows Package
        run: |
          New-Item -ItemType Directory -Force -Path windows_package
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination "windows_package\" -Recurse -Force
          Copy-Item -Path "Groovy-Setup.exe" -Destination "windows_package\" -Force

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: windows_package/

  # Linux Build
  build-linux:
    runs-on: ubuntu-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev libnotify-dev libsecret-1-dev libjsoncpp-dev libmpv-dev mpv
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'
      
      - name: Verify Dart SDK Version
        run: |
          DART_VERSION=$(dart --version | grep -oP 'Dart SDK version: \K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "✅ Dart SDK version: $DART_VERSION"
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Linux
        env:
          COUNTLY_SERVER_URL: ${{ secrets.COUNTLY_SERVER_URL }}
          COUNTLY_APP_KEY: ${{ secrets.COUNTLY_APP_KEY }}
        run: |
          if [ -n "$COUNTLY_APP_KEY" ]; then
            echo "::add-mask::$COUNTLY_APP_KEY"
            flutter build linux --release \
              --dart-define=COUNTLY_SERVER_URL="$COUNTLY_SERVER_URL" \
              --dart-define=COUNTLY_APP_KEY="$COUNTLY_APP_KEY"
          else
            flutter build linux --release
          fi
      
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/

  # Create Release with Android, Windows, and Linux artifacts
  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="1.0.58"
          fi
          echo "VERSION=$VER" >> $GITHUB_OUTPUT
          echo "TAG=v$VER" >> $GITHUB_OUTPUT

      - name: Create Tag (if workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.get_version.outputs.TAG }}" -m "Release ${{ steps.get_version.outputs.TAG }}" || true
          git push origin "${{ steps.get_version.outputs.TAG }}" || true

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts/linux/

      - name: Package Windows
        run: |
          cd artifacts/windows
          zip -r ../../groovy-windows.zip .
          cd ../..

      - name: Package Linux
        run: |
          cd artifacts/linux
          tar -czf ../../groovy-linux-x64.tar.gz .
          cd ../..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: Groovy ${{ steps.get_version.outputs.TAG }}
          body: |
            ## 🎉 Groovy ${{ steps.get_version.outputs.TAG }}

            ### 📦 Downloads

            **Android:**
            - `app-release.apk` (universal APK for Android devices)

            **Windows:**
            - `Groovy-Setup.exe` (setup installer, run to install Groovy on Windows)
            - `groovy-windows.zip` (portable version, extract and run)

            **Linux:**
            - `groovy-linux-x64.tar.gz` (extract and run groovy on Linux)

            ### 📝 Changelog
            See [CHANGELOG.md](https://github.com/Danx016/Groovy/blob/master/CHANGELOG.md)
          files: |
            artifacts/android/*.apk
            artifacts/windows/Groovy-Setup.exe
            groovy-windows.zip
            groovy-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
