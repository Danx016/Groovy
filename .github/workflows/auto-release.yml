name: Automated APK Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'react-website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.11 (Required for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/musly-release.keystore
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=musly-release.keystore
          EOF
          echo "✅ Keystore configured from secret"

      - name: Build Release APK
        env:
          COUNTLY_SERVER_URL: ${{ secrets.COUNTLY_SERVER_URL }}
          COUNTLY_APP_KEY: ${{ secrets.COUNTLY_APP_KEY }}
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=COUNTLY_SERVER_URL="$COUNTLY_SERVER_URL" \
            --dart-define=COUNTLY_APP_KEY="$COUNTLY_APP_KEY"

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          find build/app/outputs/flutter-apk -name "*.apk" | head -n 1 | xargs -I {} cp {} release-assets/app-release.apk
          find build/app/outputs/flutter-apk -name "*.apk" | head -n 1 | xargs -I {} cp {} release-assets/Groovy.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Groovy v${{ env.VERSION }}
          body: |
            ## 🎵 Groovy v${{ env.VERSION }}

            ### ✨ Novedades y Mejoras:
            - 🛡️ **Validación Estricta de Letras**: Coincidencia exacta de artista y título evitando letras de otras canciones.
            - 🎨 **Interfaz de Letras Apple Music**: Toca la carátula o título para abrir el Álbum y el artista para abrir su perfil.
            - 📋 **Cola de Reproducción Dedicada**: Corrección de saltos a la letra al interactuar con la lista de reproducción.
            - 🔔 **Reproductor en Pantalla de Bloqueo Permanente**: Soporte y permisos completos para Android 13+ y control multimedia continuo.
            - ⚡ **Optimización y Rendimiento**: Cargas de audio más rápidas y pre-buffering fluido en segundo plano.
            - 🔑 **Recuperación de Contraseña**: Flujo de validación con código OTP de 6 dígitos enviado por correo con diseño Groovy.
            - 🌐 **100% en Español**: Nombre de marca unificado a Groovy y localización en español.
          make_latest: true
          files: |
            release-assets/app-release.apk
            release-assets/Groovy.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
