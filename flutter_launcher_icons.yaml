flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  image_path_ios: "assets/app_icon_1024.png"
  remove_alpha_ios: true
  background_color_ios: "#1C1C1E"
  min_sdk_android: 21
  adaptive_icon_background: "#1C1C1E"
  adaptive_icon_foreground: "assets/app_icon.png"
  
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#1C1C1E"
    theme_color: "#FA243C"
  
  windows:
    generate: true
    image_path: "assets/app_icon_1024.png"
    icon_size: 256
  
  macos:
    generate: true
    image_path: "assets/app_icon.png"
