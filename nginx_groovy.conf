# ==============================================================================
# 🌐 Configuración de Nginx para Groovy (Frontend React + Backend Node.js)
# Ubicación sugerida en tu VPS: /etc/nginx/sites-available/groovy.conf
# ==============================================================================

server {
    listen 80;
    server_name tu-dominio.com www.tu-dominio.com; # Reemplaza con tu IP o dominio

    # Redirigir todo el tráfico HTTP a HTTPS (opcional si usas Certbot)
    # return 301 https://$host$request_uri;

    # Directorio de los archivos estáticos de React compilados
    root /ruta/a/Groovy/react-website/dist;
    index index.html;

    # Configuración de compresión Gzip para carga ultrarrápida
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Servir Frontend React (SPA - Enrutamiento y Landing de Descargas)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia el Backend de Node.js (Express API)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache para archivos estáticos (JS, CSS, Imágenes, Favicons)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
