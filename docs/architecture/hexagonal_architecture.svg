<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead forward marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <!-- Arrowhead backward marker -->
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- ==================== HEXAGON LAYERS ==================== -->

  <!-- Outer Hexagon: Infraestructura (#C1E4F7) -->
  <polygon points="340.0,137.5 620.0,137.5 760.0,380.0 620.0,622.5 340.0,622.5 200.0,380.0"
           fill="#C1E4F7" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Middle Hexagon: Aplicación (#FFBBB1) -->
  <polygon points="382.5,211.1 577.5,211.1 675.0,380.0 577.5,548.9 382.5,548.9 285.0,380.0"
           fill="#FFBBB1" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner Hexagon: Dominio (#FFECA9) -->
  <polygon points="425.0,284.7 535.0,284.7 590.0,380.0 535.0,475.3 425.0,475.3 370.0,380.0"
           fill="#FFECA9" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />

  <!-- ==================== EXTERNAL ARROWS & LABELS ==================== -->

  <!-- 1. Top: HTTP (Single Arrow ->) -->
  <line x1="480.0" y1="137.5" x2="480.0" y2="67.5"
        stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="480" y="51.5" text-anchor="middle" font-size="18" font-weight="600" fill="#000000">HTTP</text>

  <!-- 2. Top-Right: SQL (Double Arrow <->) -->
  <line x1="698.7" y1="253.8" x2="759.3" y2="218.8"
        stroke="#000000" stroke-width="2.2" marker-start="url(#arrow-start)" marker-end="url(#arrow)" />
  <text x="773.1" y="214.8"
        text-anchor="start" font-size="18" font-weight="600" fill="#000000">SQL</text>

  <!-- 3. Bottom-Right: Audio Driver (Single Arrow ->) -->
  <line x1="690.0" y1="501.2" x2="759.3" y2="541.2"
        stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="773.1" y="555.2"
        text-anchor="start" font-size="18" font-weight="600" fill="#000000">Audio Driver</text>

  <!-- 4. Bottom-Left: Rest API (Double Arrow <->) -->
  <line x1="261.3" y1="506.2" x2="200.7" y2="541.2"
        stroke="#000000" stroke-width="2.2" marker-start="url(#arrow-start)" marker-end="url(#arrow)" />
  <text x="186.9" y="555.2"
        text-anchor="end" font-size="18" font-weight="600" fill="#000000">Rest API</text>

  <!-- 5. Top-Left: Message broker (Single Arrow ->) -->
  <line x1="270.0" y1="258.8" x2="200.7" y2="218.8"
        stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="186.9" y="214.8"
        text-anchor="end" font-size="18" font-weight="600" fill="#000000">Message broker</text>

  <!-- ==================== OUTER HEXAGON LABELS ==================== -->

  <!-- Top Edge: Controladores -->
  <text x="480" y="167.5" text-anchor="middle" font-size="16" font-weight="500" fill="#000000">Controladores</text>

  <!-- Top-Right Edge: DatabaseAdapter -->
  <g transform="translate(654.1, 279.2) rotate(60)">
    <text x="0" y="4" text-anchor="middle" font-size="14.5" font-weight="500" fill="#000000">DatabaseAdapter</text>
  </g>

  <!-- Bottom-Right Edge: AudioPlayerAdapter -->
  <g transform="translate(654.1, 480.8) rotate(-60)">
    <text x="0" y="4" text-anchor="middle" font-size="14.5" font-weight="500" fill="#000000">AudioPlayerAdapter</text>
  </g>

  <!-- Bottom Edge: Infraestructura -->
  <text x="480" y="600.5" text-anchor="middle" font-size="19" font-weight="700" fill="#000000">Infraestructura</text>

  <!-- Bottom-Left Edge: RestClient -->
  <g transform="translate(305.9, 480.8) rotate(60)">
    <text x="0" y="4" text-anchor="middle" font-size="14.5" font-weight="500" fill="#000000">RestClient</text>
  </g>

  <!-- Top-Left Edge: GroovyConnectAdapter -->
  <g transform="translate(305.9, 279.2) rotate(-60)">
    <text x="0" y="4" text-anchor="middle" font-size="14" font-weight="500" fill="#000000">GroovyConnectAdapter</text>
  </g>

  <!-- ==================== MIDDLE HEXAGON LABELS ==================== -->

  <!-- Top: Casos de uso -->
  <text x="480" y="245.1" text-anchor="middle" font-size="15" font-weight="500" fill="#000000">Casos de uso</text>

  <!-- Bottom: Aplicación -->
  <text x="480" y="524.9" text-anchor="middle" font-size="18" font-weight="700" fill="#000000">Aplicación</text>

  <!-- ==================== INNER HEXAGON LABELS ==================== -->

  <!-- Entidades -->
  <text x="480" y="332" text-anchor="middle" font-size="14" font-weight="500" fill="#000000">Entidades</text>

  <!-- Eventos -->
  <text x="480" y="358" text-anchor="middle" font-size="14" font-weight="500" fill="#000000">Eventos</text>

  <!-- Dominio -->
  <text x="480" y="388" text-anchor="middle" font-size="18" font-weight="800" fill="#000000">Dominio</text>

  <!-- Repositorios -->
  <text x="480" y="416" text-anchor="middle" font-size="14" font-weight="500" fill="#000000">Repositorios</text>

  <!-- Servicios -->
  <text x="480" y="440" text-anchor="middle" font-size="14" font-weight="500" fill="#000000">Servicios</text>

</svg>